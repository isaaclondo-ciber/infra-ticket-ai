# Cambiar organization y projectKey por los que muestra SonarCloud al importar el repo.
sonar.organization=isaaclondo-ciber
sonar.projectKey=isaaclondo-ciber_infra-ticket-ai
sonar.projectName=Infra Ticket AI

sonar.sources=app
sonar.exclusions=app/favicon.ico
sonar.tests=tests/selenium
sonar.test.inclusions=tests/selenium/**/*.py
sonar.sourceEncoding=UTF-8

# El job falla si la Quality Gate no pasa.
sonar.qualitygate.wait=true

# Selenium la prueba en el navegador
sonar.coverage.exclusions=app/**