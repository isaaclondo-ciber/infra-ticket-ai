name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-y-selenium:
    name: Build y pruebas funcionales (Selenium)
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /infra-ticket-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/selenium/requirements.txt

      - name: Instalar dependencias
        run: |
          npm ci
          pip install -r tests/selenium/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Build (export estático)
        run: npm run build

      - name: Servir el export igual que GitHub Pages
        run: |
          mkdir -p sitio
          cp -r out "sitio${PAGES_BASE_PATH}"
          python -m http.server 3000 -d sitio &
          for _ in $(seq 1 15); do
            curl --fail --silent "http://localhost:3000${PAGES_BASE_PATH}/" > /dev/null && exit 0
            sleep 1
          done
          echo "::error::La landing no respondió"
          exit 1

      - name: Correr pruebas
        run: |
          BASE_URL="http://localhost:3000${PAGES_BASE_PATH}" \
            pytest tests/selenium -v --junitxml=selenium-resultados.xml

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-resultados
          path: selenium-resultados.xml

  sonarcloud:
    name: Calidad de código (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
